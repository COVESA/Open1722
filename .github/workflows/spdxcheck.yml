name: Style Checks

on:
  pull_request:
    branches: [main]

jobs:
  check-spdx-headers:
    name: Check SPDX headers

    runs-on: ubuntu-latest
    env:
      licenses: "BSD-3-Clause, BSD-3-Clause or GPL-2.0-only"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # required to grab the history of the PR
        fetch-depth: 0

    - name: Get files changed in PR
      run: |
        echo "files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | tr '\n' ',')" >> $GITHUB_ENV

    - name: Check added or modified files for correct SPDX identifiers
      uses: eclipse-kuksa/kuksa-actions/spdx@4
      with:
        files: "${{ env.files }}"
        licenses: "${{ env.licenses }}"

  format:
    name: Check formatting

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Install clang-format
      run: sudo apt update && sudo apt install -y clang-format
    - name: Check formatting of changed C/H files
      run: |
        changed=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD \
                  | grep -E '\.(c|h)$' || true)
        if [ -n "$changed" ]; then
          echo "Checking format for: $changed"
          clang-format --dry-run --Werror $changed
        else
          echo "No C/H files changed — skipping format check"
        fi
