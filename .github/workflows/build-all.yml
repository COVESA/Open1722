name: Build Open1722

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Install dependencies
      run: sudo apt update && sudo apt install -y meson libcmocka0 libcmocka-dev lcov
    - name: Run build_all.sh script
      run: ./build_all.sh
    - name: Run test_all.sh
      run: ./test_all.sh
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./build/main_coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true

  ubsan:
    runs-on: ubuntu-latest
    name: Unit tests under UBSan
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Install dependencies
      run: sudo apt update && sudo apt install -y libcmocka0 libcmocka-dev
    - name: Configure with alignment sanitizer
      run: >
        cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_FLAGS="-fsanitize=undefined,alignment -fno-sanitize-recover=all"
        -DCMAKE_CXX_FLAGS="-fsanitize=undefined,alignment -fno-sanitize-recover=all"
    - name: Build unit tests
      run: cmake --build build-ubsan --target unittests -j"$(nproc)"
    - name: Run unit tests
      run: ctest --test-dir build-ubsan --output-on-failure
